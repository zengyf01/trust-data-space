server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 禁用浏览器缓存（方便调试）
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 代理到 tds-api (用户中心登录) - 使用 = 精确匹配
    location = /api/tds {
        proxy_pass http://tds-api:8080/api/tds;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 代理到 tds-api 的其他路径
    location /api/tds/ {
        proxy_pass http://tds-api:8080/api/tds/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 代理到 dos-api - 使用 = 精确匹配
    location = /api/dos {
        proxy_pass http://dos-api:8080/api/dos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 代理到 dos-api 的其他路径
    location /api/dos/ {
        proxy_pass http://dos-api:8080/api/dos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api {
        proxy_pass http://dos-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 3001;
    server_name localhost;
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
}
