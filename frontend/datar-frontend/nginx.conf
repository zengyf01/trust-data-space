server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 代理到 datar-api
    location /api/datar/ {
        proxy_pass http://datar-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 代理到 tds-api (登录、机构、用户、角色等)
    location /api/tds/ {
        proxy_pass http://tds-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 默认代理到 datar-api
    location /api/ {
        proxy_pass http://datar-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 3001;
    server_name localhost;
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
}
