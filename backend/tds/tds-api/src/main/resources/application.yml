server:
  port: 8080
  servlet:
    context-path: /api/tds

spring:
  application:
    name: tds-api
  main:
    lazy-initialization: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/tds?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  data:
    redis:
      repositories:
        enabled: false
      host: redis
      port: 6379
  autoconfigure:
    exclude:
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration

# GMSSL隧道配置
tunnel:
  host: 0.0.0.0
  port-range-start: 34400
  port-range-end: 34500
  session-ttl-minutes: 30

# MaxKey SSO配置
maxkey:
  enabled: false
  server-url: http://localhost:8087/maxkey
  client-id: maxkey_client
  client-secret: maxkey_secret
  redirect-uri: http://localhost:8081/organization/sso/callback
  grant-type: authorization_code
  token-expire-seconds: 7200
  skip-ssl-validation: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.tds.dal.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.tds: DEBUG
    org.springframework: INFO
